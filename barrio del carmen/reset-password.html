<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Restablecer contraseña · Barrio Del Carmen</title>
  <link rel="stylesheet" href="admin.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="reset-password.js" defer></script>
</head>
<body>
  <header class="admin-header"><a href="index.html" class="admin-brand"><span>✳</span><span><b>Barrio Del Carmen</b><small>Panel de administración</small></span></a><a href="admin.html" class="back-link">← Volver al acceso</a></header>
  <main class="admin-main">
    <section class="login-card">
      <span class="eyebrow">RECUPERACIÓN DE ACCESO</span>
      <h1>Crear contraseña nueva.</h1>
      <p id="recovery-status" role="status" aria-live="polite">Estamos comprobando el enlace de recuperación…</p>
      <form id="new-password-form" hidden>
        <label>Contraseña nueva<input type="password" name="password" autocomplete="new-password" minlength="8" required></label>
        <label>Repetí la contraseña<input type="password" name="password-confirmation" autocomplete="new-password" minlength="8" required></label>
        <button class="button" type="submit">Guardar contraseña <span>↗</span></button>
        <p id="password-message" class="message" aria-live="polite"></p>
      </form>
      <a id="back-to-login" class="button" href="admin.html" hidden>Ir al inicio de sesión <span>↗</span></a>
    </section>
  </main>
  <footer>Panel privado · Barrio Del Carmen · Río Gallegos</footer>
</body>
</html>
